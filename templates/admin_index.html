<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Admin — King Midis</title>
        <link
            rel="icon"
            type="image/png"
            href="{{ url_for('static', filename='images/logo.png') }}"
        />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
        <script>
            (function () {
                try {
                    const stored = localStorage.getItem("km-theme");
                    const preferred = stored || "dark";
                    document.documentElement.setAttribute("data-theme", preferred);
                } catch (err) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            })();
        </script>
    </head>
    <body data-logo-base="work" data-admin="true">
        <main class="container">
            <header class="page-header">
                <div class="header-brand">
                    <a
                        href="{{ url_for('browse') }}"
                        class="brand-link"
                        aria-label="King Midis home"
                    >
                        <span
                            class="brand-logo"
                            data-logo-state="work"
                            role="img"
                            aria-label="King Midis logo"
                        ></span>
                    </a>
                    <div>
                        <p class="eyebrow">Admin</p>
                        <h1>Control Room</h1>
                    </div>
                </div>

                <div class="header-actions">
                    <a href="{{ url_for('browse') }}" class="admin-link">Back</a>
                    <button
                        id="themeToggle"
                        class="theme-toggle contrast"
                        aria-label="Switch theme"
                    >
                        🌙
                    </button>
                </div>
            </header>

            <section class="path-card stats-card">
                <header>
                    <h2>Server Stats</h2>
                </header>
                <div class="stats-grid">
                    <div>
                        <p class="stat-label">Composers</p>
                        <p class="stat-value">{{ stats.composers }}</p>
                    </div>
                    <div>
                        <p class="stat-label">MIDI Tracks</p>
                        <p class="stat-value">{{ stats.midis }}</p>
                    </div>
                    <div>
                        <p class="stat-label">Sheet Music</p>
                        <p class="stat-value">{{ stats.sheets }}</p>
                    </div>
                    <div>
                        <p class="stat-label">Library Size</p>
                        <p class="stat-value">{{ stats.size }}</p>
                    </div>
                </div>
            </section>

            <section class="list-card">
                <header>
                    <h2>Tools</h2>
                </header>

                <ul class="file-list">
                    <li class="dir tool-item">
                        <button
                            type="button"
                            class="tool-button"
                            onclick="window.location='{{ url_for('admin_scrubber') }}'"
                        >
                            Magic Midi Finder
                        </button>
                    </li>
                    <li class="dir tool-item">
                        <button
                            type="button"
                            class="tool-button"
                            onclick="window.location='{{ url_for('admin_mass_ai') }}'"
                        >
                            Mass AI Helper
                        </button>
                    </li>
                    <li class="dir tool-item">
                        <button
                            type="button"
                            class="tool-button"
                            onclick="window.location='{{ url_for('admin_link_parts') }}'"
                        >
                            Link Parts
                        </button>
                    </li>
                    <li class="dir tool-item">
                        <button
                            type="button"
                            class="tool-button"
                            onclick="window.location='{{ url_for('admin_pdf_cleanup') }}'"
                        >
                            Bulk PDF Cleanup
                        </button>
                    </li>
                    <li class="dir tool-item">
                        <button
                            type="button"
                            class="tool-button"
                            onclick="window.location='{{ url_for('admin_composer_clean') }}'"
                        >
                            Composer Cleanup
                        </button>
                    </li>
                    <li class="dir tool-item">
                        <button
                            type="button"
                            class="tool-button"
                            onclick="window.location='{{ url_for('admin_ai_reset') }}'"
                        >
                            Reset AI Flags
                        </button>
                    </li>
                </ul>
            </section>
        </main>

        <script src="{{ url_for('static', filename='js/logo.js') }}"></script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const toggle = document.getElementById("themeToggle");
                const root = document.documentElement;
                const STORAGE_KEY = "km-theme";

                const updateTheme = (theme) => {
                    root.setAttribute("data-theme", theme);
                    localStorage.setItem(STORAGE_KEY, theme);
                    toggle.textContent = theme === "dark" ? "🌙" : "☀️";
                };

                const currentTheme = root.getAttribute("data-theme") || "dark";
                updateTheme(currentTheme);

                toggle.addEventListener("click", () => {
                    const active = root.getAttribute("data-theme") || "dark";
                    updateTheme(active === "dark" ? "light" : "dark");
                });
            });
        </script>
    </body>
</html>
