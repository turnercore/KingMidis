<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PDF Cleanup — King Midis</title>
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
        <script>
            (function () {
                try {
                    const stored = localStorage.getItem("km-theme");
                    const preferred = stored || "dark";
                    document.documentElement.setAttribute("data-theme", preferred);
                } catch (err) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            })();
        </script>
    </head>
    <body data-logo-base="work" data-admin="true">
        <main class="container">
            <header class="page-header">
                <div class="header-brand">
                    <a href="{{ url_for('browse') }}" class="brand-link" aria-label="King Midis home">
                        <span class="brand-logo" data-logo-state="work" role="img" aria-label="King Midis logo"></span>
                    </a>
                    <div>
                        <p class="eyebrow">Admin · Tool</p>
                        <h1>Bulk PDF Cleanup</h1>
                    </div>
                </div>

                <div class="header-actions">
                    <a href="{{ url_for('admin_home') }}" class="admin-link">Admin Home</a>
                    <button id="themeToggle" class="theme-toggle contrast" aria-label="Switch theme">
                        🌙
                    </button>
                </div>
            </header>

            <section class="path-card">
                <form method="POST" class="admin-form">
                    <label>
                        Select folder
                        <select name="folder" required>
                            {% for entry in folders %}
                            <option value="{{ entry.name }}" {% if entry.name == selected %}selected{% endif %}>
                                {{ entry.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </label>
                    <p class="muted">
                        Removes PDF attachments from the folder and updates metadata attachment lists.
                    </p>
                    <div class="modal-actions">
                        <button type="submit" class="danger full-width"
                            onclick="return confirm('Remove all PDFs in this folder?');">
                            Delete PDFs
                        </button>
                    </div>
                </form>
                {% if status %}
                <p class="admin-status">{{ status }}</p>
                {% endif %}
            </section>
        </main>

        <script src="{{ url_for('static', filename='js/logo.js') }}"></script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const toggle = document.getElementById("themeToggle");
                const root = document.documentElement;
                const STORAGE_KEY = "km-theme";

                const updateTheme = (theme) => {
                    root.setAttribute("data-theme", theme);
                    localStorage.setItem(STORAGE_KEY, theme);
                    toggle.textContent = theme === "dark" ? "🌙" : "☀️";
                };

                const currentTheme = root.getAttribute("data-theme") || "dark";
                updateTheme(currentTheme);

                toggle.addEventListener("click", () => {
                    const active = root.getAttribute("data-theme") || "dark";
                    updateTheme(active === "dark" ? "light" : "dark");
                });

                if (typeof window.kmLogoSetThinking === "function") {
                    window.kmLogoSetThinking(false);
                }
            });
        </script>
    </body>
</html>
