<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Magic Midi Finder — King Midis</title>
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
        <script>
            (function () {
                try {
                    const stored = localStorage.getItem("km-theme");
                    const preferred = stored || "dark";
                    document.documentElement.setAttribute("data-theme", preferred);
                } catch (err) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            })();
        </script>
    </head>
    <body data-logo-base="search" data-admin="true">
        <main class="container">
            <header class="page-header">
                <div class="header-brand">
                    <a href="{{ url_for('browse') }}" class="brand-link" aria-label="King Midis home">
                        <span class="brand-logo" data-logo-state="search" role="img" aria-label="King Midis logo"></span>
                    </a>
                    <div>
                        <p class="eyebrow">Admin · Tool</p>
                        <h1>Magic Midi Finder</h1>
                    </div>
                </div>

                <div class="header-actions">
                    <a href="{{ url_for('admin_home') }}" class="admin-link">Admin Home</a>
                    <button id="themeToggle" class="theme-toggle contrast" aria-label="Switch theme">
                        🌙
                    </button>
                </div>
            </header>

            <section class="path-card">
                <form method="POST" class="admin-form" id="scrubForm">
                    <label>
                        Search Mutopia for…
                        <input
                            type="text"
                            name="term"
                            placeholder="e.g., Bach"
                            value="{{ term }}"
                            required
                        />
                    </label>

                    <label>
                        Source
                        <select name="source">
                            {% for src in sources %}
                            <option value="{{ src.id }}" {% if source == src.id %}selected{% endif %}>
                                {{ src.label }}
                            </option>
                            {% endfor %}
                        </select>
                    </label>

                    <label class="checkbox-field">
                        <input type="checkbox" name="download_pdf" {% if download_pdf %}checked{% endif %} />
                        <span>Download sheet music (PDF) when available</span>
                    </label>

                    <label class="checkbox-field">
                        <input type="checkbox" name="test_mode" {% if test_mode %}checked{% endif %} />
                        <span>Run limited test (3 entries)</span>
                    </label>

                    <div class="modal-actions">
                        <button type="submit" class="contrast">Scrape &amp; import</button>
                        <button type="button" class="secondary hidden" id="cancelScrub">Cancel</button>
                    </div>

                    {% if status %}
                    <p class="admin-status">{{ status }}</p>
                    {% endif %}
                </form>
            </section>

            <section class="list-card">
                <header>
                    <h2>Live log</h2>
                </header>
                <pre class="log-output" id="scrubLog">{% for line in logs %}{{ line }}&#10;{% endfor %}</pre>
            </section>

            <section class="list-card">
                <header>
                    <h2>Recent activity</h2>
                </header>

                <ul class="file-list" id="scrubSummary">
                    {% for item in summary %}
                    <li class="file">
                        <span class="file-label">{{ item.title or 'Listing' }}</span>
                        <span class="muted">{{ item.status }}</span>
                    </li>
                    {% endfor %}
                </ul>
            </section>
        </main>

        <script src="{{ url_for('static', filename='js/logo.js') }}"></script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const toggle = document.getElementById("themeToggle");
                const root = document.documentElement;
                const STORAGE_KEY = "km-theme";
                const form = document.getElementById("scrubForm");
                const statusEl = document.querySelector(".admin-status");
                const logBox = document.getElementById("scrubLog");
                const summaryList = document.getElementById("scrubSummary");
                let pollTimer = null;
                const cancelBtn = document.getElementById("cancelScrub");

                const updateTheme = (theme) => {
                    root.setAttribute("data-theme", theme);
                    localStorage.setItem(STORAGE_KEY, theme);
                    toggle.textContent = theme === "dark" ? "🌙" : "☀️";
                };

                const currentTheme = root.getAttribute("data-theme") || "dark";
                updateTheme(currentTheme);

                toggle.addEventListener("click", () => {
                    const active = root.getAttribute("data-theme") || "dark";
                    updateTheme(active === "dark" ? "light" : "dark");
                });

                const renderStatus = (data) => {
                    if (logBox) {
                        logBox.textContent = (data.log || []).join("\n");
                        logBox.scrollTop = logBox.scrollHeight;
                    }
                    if (summaryList) {
                        summaryList.innerHTML = "";
                        (data.summary || []).forEach((item) => {
                            const li = document.createElement("li");
                            li.className = "file";
                            const title = document.createElement("span");
                            title.className = "file-label";
                            title.textContent = item.title || "Listing";
                            const status = document.createElement("span");
                            status.className = "muted";
                            status.textContent = item.status || "";
                            li.appendChild(title);
                            li.appendChild(status);
                            summaryList.appendChild(li);
                        });
                    }
                    if (statusEl) {
                        if (data.error) {
                            statusEl.textContent = `Error: ${data.error}`;
                        } else if (data.running) {
                            statusEl.textContent = "Scrubbing…";
                        } else if ((data.summary || []).length) {
                            statusEl.textContent = "Finished.";
                        }
                    }
                    if (cancelBtn) {
                        cancelBtn.disabled = !data.running;
                        cancelBtn.classList.toggle("hidden", !data.running);
                    }
                };

                const fetchStatus = async () => {
                    try {
                        const res = await fetch("/admin/scrubber/status");
                        const data = await res.json();
                        renderStatus(data);
                        if (!data.running && pollTimer) {
                            clearInterval(pollTimer);
                            pollTimer = null;
                            if (typeof window.kmLogoSetThinking === "function") {
                                window.kmLogoSetThinking(false);
                            }
                        }
                    } catch (error) {
                        console.warn("Status poll failed", error);
                    }
                };

                if (form) {
                    form.addEventListener("submit", async (event) => {
                        event.preventDefault();
                        if (typeof window.kmLogoSetThinking === "function") {
                            window.kmLogoSetThinking(true);
                        }
                        const formData = new FormData(form);
                        const payload = {
                            term: (formData.get("term") || "").toString(),
                            source: formData.get("source"),
                            download_pdf: formData.get("download_pdf") === "on",
                            test_mode: formData.get("test_mode") === "on",
                        };
                        try {
                            const res = await fetch("/admin/scrubber/start", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(payload),
                            });
                            const body = await res.json().catch(() => ({}));
                            if (!res.ok) {
                                throw new Error(body.error || "Failed to start scrape");
                            }
                            if (statusEl) statusEl.textContent = "Scrubbing…";
                            if (pollTimer) clearInterval(pollTimer);
                            fetchStatus();
                            pollTimer = setInterval(fetchStatus, 1000);
                        } catch (error) {
                            console.error(error);
                            if (statusEl) statusEl.textContent = error.message || "Start failed";
                            if (typeof window.kmLogoSetThinking === "function") {
                                window.kmLogoSetThinking(false);
                            }
                        }
                    });
                }
                if (cancelBtn) {
                    cancelBtn.addEventListener("click", async () => {
                        cancelBtn.disabled = true;
                        try {
                            const res = await fetch("/admin/scrubber/cancel", { method: "POST" });
                            if (!res.ok) {
                                const body = await res.json().catch(() => ({}));
                                throw new Error(body.error || "Cancel failed");
                            }
                            if (statusEl) statusEl.textContent = "Cancelling…";
                        } catch (error) {
                            console.error(error);
                            if (statusEl) statusEl.textContent = error.message || "Cancel failed";
                        }
                    });
                }
                if (typeof window.kmLogoSetThinking === "function") {
                    window.kmLogoSetThinking(false);
                }
                fetchStatus();
            });
        </script>
    </body>
</html>
