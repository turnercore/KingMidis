<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mass AI Helper — King Midis</title>
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
        <script>
            (function () {
                try {
                    const stored = localStorage.getItem("km-theme");
                    const preferred = stored || "dark";
                    document.documentElement.setAttribute("data-theme", preferred);
                } catch (err) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            })();
        </script>
    </head>
    <body data-logo-base="work" data-admin="true">
        <main class="container">
            <header class="page-header">
                <div class="header-brand">
                    <a href="{{ url_for('browse') }}" class="brand-link" aria-label="King Midis home">
                        <span class="brand-logo" data-logo-state="work" role="img" aria-label="King Midis logo"></span>
                    </a>
                    <div>
                        <p class="eyebrow">Admin · Tool</p>
                        <h1>Mass AI Helper</h1>
                    </div>
                </div>

                <div class="header-actions">
                    <a href="{{ url_for('admin_home') }}" class="admin-link">Admin Home</a>
                    <button id="themeToggle" class="theme-toggle contrast" aria-label="Switch theme">
                        🌙
                    </button>
                </div>
            </header>

            <section class="list-card">
                <header>
                    <h2>Folders</h2>
                    <p class="muted">Click the brain to run AI on all MIDI files in that folder.</p>
                </header>
                <ul class="file-list">
                    {% for entry in folders %}
                    <li class="dir">
                        <span class="file-label">{{ entry.name }}</span>
                        <form method="POST" class="inline-form">
                            <input type="hidden" name="folder" value="{{ entry.name }}" />
                            <button class="icon-btn ai-run-btn" type="submit" title="Run AI">
                                🧠
                            </button>
                        </form>
                    </li>
                    {% endfor %}
                </ul>
                {% if status %}
                <p class="admin-status">{{ status }}</p>
                {% endif %}
            </section>

            {% if logs %}
            <section class="path-card">
                <header><strong>Log</strong></header>
                <pre class="log-output">{{ logs|join('\n') }}</pre>
            </section>
            {% endif %}
        </main>

        <script src="{{ url_for('static', filename='js/logo.js') }}"></script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const toggle = document.getElementById("themeToggle");
                const root = document.documentElement;
                const STORAGE_KEY = "km-theme";
                const forms = document.querySelectorAll(".inline-form");

                const updateTheme = (theme) => {
                    root.setAttribute("data-theme", theme);
                    localStorage.setItem(STORAGE_KEY, theme);
                    toggle.textContent = theme === "dark" ? "🌙" : "☀️";
                };

                const currentTheme = root.getAttribute("data-theme") || "dark";
                updateTheme(currentTheme);

                toggle.addEventListener("click", () => {
                    const active = root.getAttribute("data-theme") || "dark";
                    updateTheme(active === "dark" ? "light" : "dark");
                });

                forms.forEach((form) => {
                    form.addEventListener("submit", () => {
                        if (typeof window.kmLogoSetThinking === "function") {
                            window.kmLogoSetThinking(true);
                        }
                    });
                });

                if (typeof window.kmLogoSetThinking === "function") {
                    window.kmLogoSetThinking(false);
                }
            });
        </script>
    </body>
</html>
